<div class="leaderboard-result" 
    [style.color]="textColour"
    [style.background]="gradientBackground"
    >
    <div class="leaderboard-result-position">
        {{ position + "."}}
    </div> 
    <div class="leaderboard-result-content">
        <div class="leaderboard-result-name">
            {{ playerName }}
        </div>
        <div class="leaderboard-result-points">
            {{ points }}
        </div>
    </div>
    <img *ngIf="showImage"
        class="team-logo" 
        [src]="imagePath" 
        >
</div>
