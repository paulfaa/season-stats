<div class="leaderboard-result" 
    [style.color]="textColour"
    [style.backgroundColor]="backgroundColour"
    >
    <div class="leaderboard-result-position">
        {{ position + "."}}
    </div> 
    <div class="leaderboard-result-name">
        {{ playerName }}
    </div>
    <div class="leaderboard-result-points">{{ points }}</div>
    <img *ngIf="showImage"
        class="team-logo" 
        [src]="imagePath" 
        >
</div>
