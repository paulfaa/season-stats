<form class="login" [formGroup]="loginForm" class="login" (ngSubmit)="submit()">
  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput type="text" required="true" formControlName="usernameInput">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput required="true" formControlName="passwordInput" [type]="hidePassword ? 'password' : 'text'">
    <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="hidePassword">
      <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>

  <button id="login-button" [disabled]="loginForm.invalid" mat-raised-button color="primary" type="submit">Login</button>

  <mat-error *ngIf="errorMessage">
    {{ errorMessage }}
  </mat-error>
</form>
