<ng-container *ngIf="(podiumStats$ | async)?.length && (individualStats$ | async)?.length; else loading">
  <div class="stats-container">
    <app-number-display 
      *ngFor="let number of individualStats$ | async" 
      [individualResult]="number">
    </app-number-display>

    <mat-divider></mat-divider>

    <app-podium 
      *ngFor="let podium of podiumStats$ | async" 
      [podiumTitle]="podium.title"
      [subtitle]="podium.subtitle" 
      [podiumData]="podium.players"
      [isNegative]="podium.isNegative"
      [invertOrder]="podium.invertOrder"
      >
    </app-podium>
  </div>
</ng-container>

<ng-template #loading>
  <loading-spinner></loading-spinner>
</ng-template>
