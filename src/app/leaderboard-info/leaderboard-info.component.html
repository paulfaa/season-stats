<mat-dialog-content>
    <h2 class="dialog-header">Points awarded based on F1 scoring:</h2>

    <table mat-table [dataSource]="f1PointsRow" class="mat-elevation-z2" style="width: 100%;">
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef> {{ column }} </th>
            <td mat-cell *matCellDef="let row"> {{ row[column] }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions-right">
    <button matButton mat-dialog-close cdkFocusInitial>Close</button>
</mat-dialog-actions>
