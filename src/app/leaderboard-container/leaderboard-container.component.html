<ng-container *ngIf="(results$ | async)?.races?.length && (results$ | async)!.races!.length > 0; else loading">

  <div class="leaderboard">
    <div class="leaderboard-header">
      <h1>Driver Standings</h1>
      <mat-icon class="info-icon" (click)="openDialog()">info</mat-icon>
    </div>

    <leaderboard-result *ngFor="let player of leaderboard$ | async; let i = index" [playerName]="player.playerName"
      [points]="player.points" [position]="i + 1">
    </leaderboard-result>
  </div>

  <mat-divider></mat-divider>

  <div class="race-breakdown" style="overflow-x: auto;">
    <h1>History</h1>
    <player-results-container *ngFor="let race of (results$ | async)?.races; let i = index"
      [date]="race.date"
      [results]="race.players"
      [ngClass]="{ 'alt-background': i % 2 === 1 }">
    </player-results-container>
  </div>
</ng-container>

<ng-template #loading>
  <loading-spinner></loading-spinner>
</ng-template>
