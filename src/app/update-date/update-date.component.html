<div id="update-date">
  <ng-container *ngIf="lastUpdateDate$ | async as lastUpdateDate; else loading">
    <p>
      Last updated:
    </p>
    <p class="date">
      {{ lastUpdateDate | date }}
    </p>
  </ng-container>
  <ng-template #loading>
    <p>
      Last updated:
    </p>
    <p class="date">
      loading...
    </p>
  </ng-template>
</div>
