<div class="sticky-header">
  <mat-toolbar>
    <mat-toolbar-row>
      <span id="main-title">GTA Wrapped 2025</span>
      <span class="spacer"></span>
      <update-date></update-date>
    </mat-toolbar-row>
  </mat-toolbar>

  <!-- todo: fix issue with [selectedIndex]="selectedTabIndex" -->
  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="center" (selectedIndexChange)="onTabChange($event)">
    <mat-tab *ngFor="let tab of tabs">
      <ng-template mat-tab-label>
        <mat-icon>{{ tab.icon }}</mat-icon>
        {{ tab.label }}
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>

<router-outlet></router-outlet>

<div class="version-info">
  <p>Version: {{APP_VERSION}}</p>
  <p>
    <a [routerLink]="['/version-history']"> Version history </a>
  </p>
</div>
