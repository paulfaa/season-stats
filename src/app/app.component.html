<div class="sticky-header">
  <mat-toolbar>
    <mat-toolbar-row>
      <span id="main-title">GTA Wrapped 2025</span>
      <span class="spacer"></span>
      <update-date></update-date>
    </mat-toolbar-row>
  </mat-toolbar>

  <nav mat-tab-nav-bar mat-align-tabs="center">
    <a mat-tab-link *ngFor="let tab of tabs" [routerLink]="tab.route" routerLinkActive #rla="routerLinkActive"
      [active]="rla.isActive" [routerLinkActiveOptions]="{ exact: true }">
      <!--also need to navigate to 0,0 on new page-->
      <mat-icon>{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  </nav>
</div>

<router-outlet></router-outlet>

<div class="version-info">
  <p>Version: {{APP_VERSION}}</p>
  <p>
    <a [routerLink]="['/version-history']"> Version history </a>
  </p>
</div>
