<ng-container *ngIf="(tableData$ | async) as tables">
  <div class="tables">
    <ng-container *ngFor="let table of tables">
      <h2 class="table-title">{{ table.title }}</h2>

      <table mat-table [dataSource]="table.data" class="mat-elevation-z2">

        <ng-container matColumnDef="playerName">
          <th mat-header-cell *matHeaderCellDef> {{ table.columnHeaders.playerName }} </th>
          <td mat-cell *matCellDef="let row"> {{ row.playerName }} </td>
        </ng-container>

        <ng-container matColumnDef="points">
          <th mat-header-cell *matHeaderCellDef class="centered"> {{ table.columnHeaders.points }} </th>
          <td mat-cell *matCellDef="let row" class="centered" [ngStyle]="{ 'background-color': row.scoreColor }">
            {{ row.points }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['playerName', 'points']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['playerName', 'points']"></tr>

      </table>
    </ng-container>
  </div>
</ng-container>



<ng-container *ngIf="(individualStats$ | async)?.length; else loading">
  <div class="stats-container">
    <app-number-display 
      *ngFor="let number of individualStats$ | async" 
      [individualResult]="number">
    </app-number-display>
  </div>
</ng-container>

<ng-template #loading>
  <loading-spinner></loading-spinner>
</ng-template>
